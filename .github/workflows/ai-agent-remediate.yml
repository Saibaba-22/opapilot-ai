name: AI Agent - Human Approved Remediation

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue_number:
        description: RCA issue number to remediate
        required: true
        type: string
      run_id:
        description: Optional failed run ID to fetch logs again
        required: false
        type: string

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: ai-agent-remediate-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  remediate:
    name: Create AI remediation pull request
    if: github.event_name == 'workflow_dispatch' || (github.event.issue.pull_request == null && contains(github.event.comment.body, '/ai-agent approve'))
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Authorize approval command
        env:
          EVENT_NAME: ${{ github.event_name }}
          AUTHOR_ASSOCIATION: ${{ github.event.comment.author_association }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "issue_comment" ]; then
            case "$AUTHOR_ASSOCIATION" in
              OWNER|MEMBER|COLLABORATOR)
                echo "Approval command authorized for $AUTHOR_ASSOCIATION"
                ;;
              *)
                echo "Only OWNER, MEMBER, or COLLABORATOR comments may approve AI remediation. Current association: $AUTHOR_ASSOCIATION"
                exit 1
                ;;
            esac
            if ! printf '%s' "$COMMENT_BODY" | grep -q '/ai-agent approve'; then
              echo "No approval command found"
              exit 1
            fi
          fi

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.AI_AGENT_GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install google-generativeai==0.8.3
          python -m pip install -r requirements-dev.txt

      - name: Resolve issue and run context
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p ai-agent-input

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ISSUE_NUMBER="${{ inputs.issue_number }}"
            RUN_ID="${{ inputs.run_id }}"
          else
            ISSUE_NUMBER="${{ github.event.issue.number }}"
            RUN_ID=""
          fi

          gh issue view "$ISSUE_NUMBER" --json title,body,url,labels > ai-agent-input/issue.json
          python - <<'PY'
          import json
          data = json.load(open('ai-agent-input/issue.json', encoding='utf-8'))
          with open('ai-agent-input/issue.md', 'w', encoding='utf-8') as f:
              f.write('# ' + data.get('title', 'AI RCA issue') + '\n\n')
              f.write(data.get('body') or '')
              f.write('\n')
          PY

          if [ -z "$RUN_ID" ]; then
            RUN_ID=$(grep -Eo 'Run ID: [0-9]+' ai-agent-input/issue.md | awk '{print $3}' | head -1 || true)
          fi

          echo "ISSUE_NUMBER=$ISSUE_NUMBER" >> "$GITHUB_ENV"
          echo "RUN_ID=$RUN_ID" >> "$GITHUB_ENV"

          if [ -n "$RUN_ID" ]; then
            gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --log > ai-agent-input/combined.log || true
          else
            echo "No run ID found in issue; remediation will use issue RCA and repository context only." > ai-agent-input/combined.log
          fi

      - name: Run approved AI remediation v3 with validation retry loop
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AI_AGENT_API_KEY: ${{ secrets.AI_AGENT_API_KEY }}
          AI_AGENT_MODEL: ${{ vars.AI_AGENT_MODEL }}
          AI_AGENT_MAX_ATTEMPTS: ${{ vars.AI_AGENT_MAX_ATTEMPTS }}
        run: |
          set -euo pipefail
          python scripts/ai_ci_agent.py remediate \
            --issue-body ai-agent-input/issue.md \
            --logs-file ai-agent-input/combined.log \
            --output-dir ai-agent-output \
            --max-attempts "${AI_AGENT_MAX_ATTEMPTS:-3}"

      - name: Upload remediation artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-agent-remediation-${{ env.ISSUE_NUMBER }}-${{ github.run_id }}
          path: ai-agent-output/
          retention-days: 30

      - name: Create pull request
        env:
          GH_TOKEN: ${{ secrets.AI_AGENT_GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Do not include transient RCA/remediation artifacts in the remediation PR.
          git restore -- ai-agent-input ai-agent-output || true

          BRANCH="ai-agent/remediate-issue-${ISSUE_NUMBER}-${GITHUB_RUN_ID}"
          git config user.name "ai-agent[bot]"
          git config user.email "ai-agent[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"

          ALLOWED_PATHS=(
            ".github/workflows/deploy.yml"
            ".github/workflows/ai-agent-rca.yml"
            ".github/workflows/ai-agent-remediate.yml"
            ".github/workflows/ai-agent-guardian.yml"
            "Dockerfile"
            ".dockerignore"
            ".gitignore"
            "requirements.txt"
            "requirements-dev.txt"
            "app.py"
            "tests/test_app.py"
            "tests/test_training_failure.py"
            "README.md"
            "docs/AI_AGENT_RUNBOOK.md"
            "scripts/ai_ci_agent.py"
          )

          for path in "${ALLOWED_PATHS[@]}"; do
            if [ -e "$path" ] || git ls-files --error-unmatch "$path" >/dev/null 2>&1; then
              git add "$path" || true
            fi
          done

          if git diff --cached --quiet; then
            gh issue comment "$ISSUE_NUMBER" --body "AI remediation was approved and validation ran, but no safe repository code change was produced. Please review the RCA and remediation artifacts for manual actions."
            exit 0
          fi

          git commit -m "AI agent remediation for issue #$ISSUE_NUMBER"
          git push origin "$BRANCH"

          cat > ai-agent-output/pr-body.md <<EOF
          ## AI Agent Remediation v4

          This pull request was created only after a human approved the RCA issue with `/ai-agent approve`.

          - RCA issue: #$ISSUE_NUMBER
          - Failed run ID: ${RUN_ID:-not available}
          - Remediation artifact: ai-agent-remediation-${ISSUE_NUMBER}-${GITHUB_RUN_ID}

          ### What v4 validates before PR creation

          - Python syntax validation
          - Pytest
          - Docker image build
          - Container `/health` smoke test on the dynamically discovered app port
          - Up to three remediation attempts by default when validation fails

          ### Safety gates

          - This PR must be reviewed and merged by a human.
          - After merge to `main`, Docker publishing requires the `docker-publish` environment approval.
          - Production deployment requires the `production` environment approval.
          EOF

          PR_URL=$(gh pr create \
            --title "AI remediation for CI/CD failure #$ISSUE_NUMBER" \
            --body-file ai-agent-output/pr-body.md \
            --base main \
            --head "$BRANCH")

          gh issue comment "$ISSUE_NUMBER" --body "AI remediation pull request created: $PR_URL"
          echo "Created PR: $PR_URL"

      - name: Comment remediation failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.AI_AGENT_GITHUB_TOKEN }}
        run: |
          set +e
          if [ -z "${ISSUE_NUMBER:-}" ]; then
            echo "ISSUE_NUMBER not available; cannot comment on issue."
            exit 0
          fi

          {
            echo "AI remediation v3 failed after the approved remediation attempt."
            echo
            echo "Please review the workflow logs and the uploaded artifact named:"
            echo
            echo "ai-agent-remediation-${ISSUE_NUMBER}-${GITHUB_RUN_ID}"
            echo
            if [ -f ai-agent-output/remediation-plan.md ]; then
              echo "## Remediation plan summary"
              head -c 6000 ai-agent-output/remediation-plan.md
            fi
          } > ai-agent-output/failure-comment.md

          gh issue comment "$ISSUE_NUMBER" --body-file ai-agent-output/failure-comment.md || true
