name: Build and Deploy AI DevOps Assistant

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      cloud:
        description: "Choose deployment target"
        required: true
        type: choice
        default: both
        options:
          - aws
          - azure
          - both

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: opspilotai
  CONTAINER_NAME: opspilot
  VM_USERNAME: ordinary

jobs:
  validate:
    name: Validate Python app and Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Python syntax check
        run: |
          set -euo pipefail
          python -m py_compile app.py

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image locally
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: local/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Smoke test container health endpoint
        run: |
          set -euo pipefail
          docker run -d \
            -p 5000:5000 \
            -e GEMINI_API_KEY=dummy-for-healthcheck \
            --name ${{ env.CONTAINER_NAME }}-ci \
            local/${{ env.IMAGE_NAME }}:${{ github.sha }}

          cleanup() {
            docker logs ${{ env.CONTAINER_NAME }}-ci || true
            docker rm -f ${{ env.CONTAINER_NAME }}-ci || true
          }
          trap cleanup EXIT

          for i in {1..10}; do
            if curl -fsS http://localhost:5000/health; then
              echo "Container health check passed"
              exit 0
            fi
            sleep 2
          done

          echo "Container health check failed"
          exit 1

  pytest:
    name: Run pytest tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install test dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run pytest
        run: |
          set -euo pipefail
          pytest -q

  detect-clouds:
    name: Detect available cloud targets
    runs-on: ubuntu-latest
    outputs:
      target: ${{ steps.detect.outputs.target }}
      aws_available: ${{ steps.detect.outputs.aws_available }}
      azure_available: ${{ steps.detect.outputs.azure_available }}
      request_aws: ${{ steps.detect.outputs.request_aws }}
      request_azure: ${{ steps.detect.outputs.request_azure }}
      deploy_aws: ${{ steps.detect.outputs.deploy_aws }}
      deploy_azure: ${{ steps.detect.outputs.deploy_azure }}
      any_deployable: ${{ steps.detect.outputs.any_deployable }}
      no_cloud_detected: ${{ steps.detect.outputs.no_cloud_detected }}

    steps:
      - name: Detect cloud availability
        id: detect
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_PASS: ${{ secrets.VM_PASS }}
          REQUESTED_CLOUD: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.cloud || 'auto' }}
        run: |
          set -euo pipefail

          target="${REQUESTED_CLOUD:-auto}"

          aws_available=false
          azure_available=false
          request_aws=false
          request_azure=false
          deploy_aws=false
          deploy_azure=false

          if [ -n "${EC2_HOST}" ] && [ -n "${EC2_SSH_KEY}" ]; then
            aws_available=true
          fi

          if [ -n "${VM_HOST}" ] && [ -n "${VM_PASS}" ]; then
            azure_available=true
          fi

          case "$target" in
            auto|both)
              request_aws=true
              request_azure=true
              [ "$aws_available" = true ] && deploy_aws=true
              [ "$azure_available" = true ] && deploy_azure=true
              ;;
            aws)
              request_aws=true
              [ "$aws_available" = true ] && deploy_aws=true
              ;;
            azure)
              request_azure=true
              [ "$azure_available" = true ] && deploy_azure=true
              ;;
            *)
              echo "Unsupported cloud input: $target"
              exit 1
              ;;
          esac

          any_deployable=false
          if [ "$deploy_aws" = true ] || [ "$deploy_azure" = true ]; then
            any_deployable=true
          fi

          no_cloud_detected=false
          if [ "$aws_available" = false ] && [ "$azure_available" = false ]; then
            no_cloud_detected=true
          fi

          {
            echo "target=$target"
            echo "aws_available=$aws_available"
            echo "azure_available=$azure_available"
            echo "request_aws=$request_aws"
            echo "request_azure=$request_azure"
            echo "deploy_aws=$deploy_aws"
            echo "deploy_azure=$deploy_azure"
            echo "any_deployable=$any_deployable"
            echo "no_cloud_detected=$no_cloud_detected"
          } >> "$GITHUB_OUTPUT"

      - name: Write cloud detection note
        run: |
          {
            echo "## Cloud Detection"
            echo ""
            echo "- Requested target: ${{ steps.detect.outputs.target }}"
            echo "- AWS available: ${{ steps.detect.outputs.aws_available }}"
            echo "- Azure available: ${{ steps.detect.outputs.azure_available }}"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${{ steps.detect.outputs.no_cloud_detected }}" = "true" ]; then
            echo "> No cloud detected. Neither AWS nor Azure secrets are configured." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ "${{ steps.detect.outputs.request_aws }}" = "true" ] && [ "${{ steps.detect.outputs.aws_available }}" != "true" ]; then
            echo "> AWS not available: EC2_HOST and/or EC2_SSH_KEY secrets missing." >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "${{ steps.detect.outputs.request_azure }}" = "true" ] && [ "${{ steps.detect.outputs.azure_available }}" != "true" ]; then
            echo "> Azure not available: VM_HOST and/or VM_PASS secrets missing." >> "$GITHUB_STEP_SUMMARY"
          fi

  docker-publish:
    name: Publish Docker image after human approval
    runs-on: ubuntu-latest
    needs: [validate, pytest]
    timeout-minutes: 20
    environment:
      name: docker-publish
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest

  deploy:
    name: Deploy approval gate
    runs-on: ubuntu-latest
    needs: [docker-publish, detect-clouds]
    if: needs.detect-clouds.outputs.any_deployable == 'true'
    timeout-minutes: 10
    environment:
      name: production

    steps:
      - name: Deployment approved
        run: |
          echo "Deployment approved"
          echo "AWS deploy: ${{ needs.detect-clouds.outputs.deploy_aws }}"
          echo "Azure deploy: ${{ needs.detect-clouds.outputs.deploy_azure }}"

  deploy-aws:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest
    needs: [detect-clouds, deploy]
    if: needs.detect-clouds.outputs.deploy_aws == 'true' && needs.deploy.result == 'success'
    timeout-minutes: 15

    steps:
      - name: Deploy immutable image tag to AWS EC2
        uses: appleboy/ssh-action@v1.0.3
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          IMAGE_TAG: ${{ github.sha }}
          CONTAINER_NAME: ${{ env.CONTAINER_NAME }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: DOCKERHUB_USERNAME,DOCKERHUB_TOKEN,GEMINI_API_KEY,IMAGE_NAME,IMAGE_TAG,CONTAINER_NAME
          script_stop: true
          script: |
            set -Eeuo pipefail

            IMAGE="$DOCKERHUB_USERNAME/$IMAGE_NAME:$IMAGE_TAG"
            echo "Deploying image to AWS: $IMAGE"

            echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin

            echo "Pulling image..."
            docker pull "$IMAGE"

            echo "Replacing old container if it exists..."
            docker rm -f "$CONTAINER_NAME" || true

            echo "Starting new container..."
            docker run -d \
              -p 5000:5000 \
              -e GEMINI_API_KEY="$GEMINI_API_KEY" \
              --name "$CONTAINER_NAME" \
              --restart unless-stopped \
              "$IMAGE"

            echo "Verifying container health..."
            for i in {1..10}; do
              if curl -fsS http://localhost:5000/health; then
                echo "AWS deployment health check passed"
                docker inspect --format='Deployed image ID: {{.Image}}' "$CONTAINER_NAME"
                exit 0
              fi
              docker logs --tail=50 "$CONTAINER_NAME" || true
              sleep 3
            done

            echo "AWS deployment health check failed"
            docker logs "$CONTAINER_NAME" || true
            exit 1

  deploy-azure:
    name: Deploy to Azure VM
    runs-on: ubuntu-latest
    needs: [detect-clouds, deploy]
    if: needs.detect-clouds.outputs.deploy_azure == 'true' && needs.deploy.result == 'success'
    timeout-minutes: 15

    steps:
      - name: Deploy immutable image tag to Azure VM
        uses: appleboy/ssh-action@v1.0.3
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          IMAGE_TAG: ${{ github.sha }}
          CONTAINER_NAME: ${{ env.CONTAINER_NAME }}
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ env.VM_USERNAME }}
          password: ${{ secrets.VM_PASS }}
          envs: DOCKERHUB_USERNAME,DOCKERHUB_TOKEN,GEMINI_API_KEY,IMAGE_NAME,IMAGE_TAG,CONTAINER_NAME
          script_stop: true
          script: |
            set -Eeuo pipefail

            IMAGE="$DOCKERHUB_USERNAME/$IMAGE_NAME:$IMAGE_TAG"
            echo "Deploying image to Azure: $IMAGE"

            echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin

            echo "Pulling image..."
            docker pull "$IMAGE"

            echo "Replacing old container if it exists..."
            docker rm -f "$CONTAINER_NAME" || true

            echo "Starting new container..."
            docker run -d \
              -p 5000:5000 \
              -e GEMINI_API_KEY="$GEMINI_API_KEY" \
              --name "$CONTAINER_NAME" \
              --restart unless-stopped \
              "$IMAGE"

            echo "Verifying container health..."
            for i in {1..10}; do
              if curl -fsS http://localhost:5000/health; then
                echo "Azure deployment health check passed"
                docker inspect --format='Deployed image ID: {{.Image}}' "$CONTAINER_NAME"
                exit 0
              fi
              docker logs --tail=50 "$CONTAINER_NAME" || true
              sleep 3
            done

            echo "Azure deployment health check failed"
            docker logs "$CONTAINER_NAME" || true
            exit 1

  deployment-summary:
    name: Deployment summary
    runs-on: ubuntu-latest
    if: always()
    needs: [detect-clouds, docker-publish, deploy, deploy-aws, deploy-azure]

    steps:
      - name: Write final summary
        run: |
          {
            echo "## Deployment Summary"
            echo ""
            echo "| Item | Value |"
            echo "|------|-------|"
            echo "| Trigger | ${{ github.event_name }} |"
            echo "| Requested target | ${{ needs.detect-clouds.outputs.target }} |"
            echo "| AWS available | ${{ needs.detect-clouds.outputs.aws_available }} |"
            echo "| Azure available | ${{ needs.detect-clouds.outputs.azure_available }} |"
            echo "| Docker publish | ${{ needs.docker-publish.result }} |"
            echo "| Deploy gate | ${{ needs.deploy.result }} |"
            echo "| AWS deploy | ${{ needs.deploy-aws.result }} |"
            echo "| Azure deploy | ${{ needs.deploy-azure.result }} |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${{ needs.detect-clouds.outputs.no_cloud_detected }}" = "true" ]; then
            echo "> **No cloud detected.** Neither AWS nor Azure secrets are configured." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ "${{ needs.detect-clouds.outputs.request_aws }}" = "true" ] && [ "${{ needs.detect-clouds.outputs.aws_available }}" != "true" ]; then
            echo "> **AWS not available:** Add EC2_HOST and EC2_SSH_KEY secrets." >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "${{ needs.detect-clouds.outputs.request_azure }}" = "true" ] && [ "${{ needs.detect-clouds.outputs.azure_available }}" != "true" ]; then
            echo "> **Azure not available:** Add VM_HOST and VM_PASS secrets." >> "$GITHUB_STEP_SUMMARY"
          fi
