name: Build and Deploy AI DevOps Assistant

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: devops-ai-assistant
  CONTAINER_NAME: ai-assistant

jobs:
  validate:
    name: Validate Python app and Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Python dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Python syntax check
        run: |
          set -euo pipefail
          python -m py_compile app.py

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image locally
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: local/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Smoke test container health endpoint
        run: |
          set -euo pipefail
          docker run -d \
            -p 5000:5000 \
            -e GEMINI_API_KEY=dummy-for-healthcheck \
            --name ${{ env.CONTAINER_NAME }}-ci \
            local/${{ env.IMAGE_NAME }}:${{ github.sha }}

          cleanup() {
            docker logs ${{ env.CONTAINER_NAME }}-ci || true
            docker rm -f ${{ env.CONTAINER_NAME }}-ci || true
          }
          trap cleanup EXIT

          for i in {1..10}; do
            if curl -fsS http://localhost:5000/health; then
              echo "Container health check passed"
              exit 0
            fi
            sleep 2
          done

          echo "Container health check failed"
          exit 1

  pytest:
    name: Run pytest tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install test dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run pytest
        run: |
          set -euo pipefail
          pytest -q

  docker-publish:
    name: Publish Docker image after human approval
    runs-on: ubuntu-latest
    needs: [validate, pytest]
    timeout-minutes: 20
    environment:
      name: docker-publish
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest

  deploy:
    name: Deploy to EC2 after human approval
    runs-on: ubuntu-latest
    needs: docker-publish
    timeout-minutes: 15
    environment:
      name: production

    steps:
      - name: Deploy immutable image tag to AWS EC2
        uses: appleboy/ssh-action@v1.0.3
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          IMAGE_TAG: ${{ github.sha }}
          CONTAINER_NAME: ${{ env.CONTAINER_NAME }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: DOCKERHUB_USERNAME,DOCKERHUB_TOKEN,GEMINI_API_KEY,IMAGE_NAME,IMAGE_TAG,CONTAINER_NAME
          script_stop: true
          script: |
            set -Eeuo pipefail

            IMAGE="$DOCKERHUB_USERNAME/$IMAGE_NAME:$IMAGE_TAG"
            echo "Deploying image: $IMAGE"

            echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin

            echo "Pulling image..."
            docker pull "$IMAGE"

            echo "Replacing old container if it exists..."
            docker rm -f "$CONTAINER_NAME" || true

            echo "Starting new container..."
            docker run -d \
              -p 5000:5000 \
              -e GEMINI_API_KEY="$GEMINI_API_KEY" \
              --name "$CONTAINER_NAME" \
              --restart unless-stopped \
              "$IMAGE"

            echo "Verifying container health..."
            for i in {1..10}; do
              if curl -fsS http://localhost:5000/health; then
                echo "Deployment health check passed"
                docker inspect --format='Deployed image ID: {{.Image}}' "$CONTAINER_NAME"
                exit 0
              fi
              docker logs --tail=50 "$CONTAINER_NAME" || true
              sleep 3
            done

            echo "Deployment health check failed"
            docker logs "$CONTAINER_NAME" || true
            exit 1
